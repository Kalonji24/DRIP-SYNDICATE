apiVersion: v1
kind: Secret
metadata:
  name: drip-secrets
  namespace: drip-syndicate
type: Opaque
stringData:
  # Replace every value below before applying. Never commit real secrets.
  ConnectionStrings__Default: "Host=db.YOUR_PROJECT.supabase.co;Port=5432;Database=postgres;Username=postgres;Password=CHANGE_ME;SSL Mode=Require;Trust Server Certificate=true"
  Jwt__Secret: "CHANGE_ME_TO_A_LONG_RANDOM_STRING_AT_LEAST_32_CHARS"
  Supabase__Url: "https://YOUR_PROJECT.supabase.co"
  Supabase__ServiceKey: "CHANGE_ME_SUPABASE_SERVICE_ROLE_KEY"
