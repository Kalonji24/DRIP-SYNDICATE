apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drip-ingress
  namespace: drip-syndicate
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.dripsyndicate.com
        - api.dripsyndicate.com
      secretName: drip-tls
  rules:
    # Storefront
    - host: shop.dripsyndicate.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
    # API
    - host: api.dripsyndicate.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 80 }
